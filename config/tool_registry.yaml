# Single source of truth (TOC) for the hybrid harness.
# Operator (weak local model) only sees name/desc/tags unless --full is passed.
# Developer factory writes new entries here after tests pass.

version: 1
timezone: Asia/Hong_Kong

tools:
  - name: calendar_gateway
    desc: "DEMO ONLY. Sample harness tool (mock calendar webhook). Not a live calendar client."
    tags: [demo, calendar, write, edge, webhook]
    entry: tools/calendar_gateway.py
    risk: write
    params:
      - name: action
        type: enum
        required: true
        values: [list, create, update, delete]
      - name: start
        type: datetime
        required: false
        notes: RFC3339. Guard rejects timestamps in the past for write actions.
      - name: end
        type: datetime
        required: false
      - name: title
        type: string
        required: false
      - name: event_id
        type: string
        required: false

  - name: time_ops_reader
    desc: Read weekly exception-time log (holidays, overrides, on-call).
    tags: [time, read, ops]
    entry: tools/time_ops_reader.py
    risk: read
    params:
      - name: week_of
        type: date
        required: false
        notes: YYYY-MM-DD. Defaults to current ISO week in HARNESS_TZ.
      - name: path
        type: path
        required: false
        notes: Override TIME_OPS_LOG_PATH.
