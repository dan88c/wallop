name: release-binaries

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event.head_commit.message != '' && !contains(github.event.head_commit.message, '[skip ci]'))
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: core-operator/go.sum

      - name: Cross-compile wallop
        working-directory: core-operator
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p ../dist
          ldflags='-s -w'
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="$ldflags" -o ../dist/wallop-windows-amd64.exe ./cmd/wallop
          GOOS=darwin  GOARCH=arm64 go build -trimpath -ldflags="$ldflags" -o ../dist/wallop-darwin-arm64 ./cmd/wallop
          GOOS=linux   GOARCH=amd64 go build -trimpath -ldflags="$ldflags" -o ../dist/wallop-linux-amd64 ./cmd/wallop
          ls -la ../dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wallop-binaries
          path: |
            dist/wallop-windows-amd64.exe
            dist/wallop-darwin-arm64
            dist/wallop-linux-amd64

      - name: Publish GitHub Release (tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/wallop-windows-amd64.exe
            dist/wallop-darwin-arm64
            dist/wallop-linux-amd64
          generate_release_notes: true

      - name: Refresh nightly prerelease (main)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: nightly
          prerelease: true
          make_latest: false
          body: |
            Rolling binaries from `main`.
            Fetch with `python3 scripts/bootstrap.py --download` (copies into `bin/`).
            Do not commit these files into `dist/`.
          files: |
            dist/wallop-windows-amd64.exe
            dist/wallop-darwin-arm64
            dist/wallop-linux-amd64
