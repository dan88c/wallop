name: release-binaries

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event.head_commit.message != '' && !contains(github.event.head_commit.message, '[skip ci]')
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Cross-compile wallop
        working-directory: core-operator
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p ../dist
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o ../dist/wallop-windows-amd64.exe ./cmd/harness
          GOOS=darwin  GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o ../dist/wallop-darwin-arm64 ./cmd/harness
          GOOS=linux   GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o ../dist/wallop-linux-amd64 ./cmd/harness
          ls -la ../dist

      - name: Commit dist/ into the repo
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "wallop-ci"
          git config user.email "34788707+dan88c@users.noreply.github.com"
          git add -f dist/wallop-windows-amd64.exe dist/wallop-darwin-arm64 dist/wallop-linux-amd64 dist/README.md
          if git diff --cached --quiet; then
            echo "dist unchanged"
            exit 0
          fi
          git commit -m "chore: refresh dist binaries [skip ci]"
          git push

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wallop-binaries
          path: |
            dist/wallop-windows-amd64.exe
            dist/wallop-darwin-arm64
            dist/wallop-linux-amd64

      - name: Publish GitHub Release (tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/wallop-windows-amd64.exe
            dist/wallop-darwin-arm64
            dist/wallop-linux-amd64
          generate_release_notes: true

      - name: Refresh nightly prerelease (main)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: nightly
          prerelease: true
          make_latest: false
          body: |
            Rolling binaries from `main`.
            Also copied into `dist/` in the repo.
            Copy the file for your OS to `bin/wallop` (Windows: `bin/wallop.exe`).
          files: |
            dist/wallop-windows-amd64.exe
            dist/wallop-darwin-arm64
            dist/wallop-linux-amd64
