name: test

on:
  push:
  pull_request:

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install and test
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r developer-factory/requirements.txt
          python -m pytest tests/python_tests tests/test_factory_pipeline.py -q

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: |
            core-operator/go.sum
            tests/go_tests/go.sum
      - name: Test operator
        working-directory: core-operator
        run: go test ./...
      - name: Build CLI
        working-directory: core-operator
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p ../bin
          go build -trimpath -ldflags="-s -w" -o ../bin/wallop ./cmd/wallop
      - name: Test pointer smoke
        working-directory: tests/go_tests
        run: go test ./...
